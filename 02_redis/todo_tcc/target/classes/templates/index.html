<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input[type="submit"] {
            background: #4facfe;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #00c6ff;
            transform: scale(1.03);
        }

        .nome {
            text-align: center;
            margin-top: 15px;
            color: white;
            font-weight: bold;
        }

        .botao-list {
    margin-top: 15px;
    text-decoration: none;
    background: white;
    color: #4facfe;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.botao-list:hover {
    background: #4facfe;
    color: white;
    transform: translateY(-2px);
}
    </style>
</head>

<body>

    <form action="/add" method="post">
        <h2>Novo Registro</h2>

        <label>Título</label>
        <input type="text" name="titulo">

        <label>Segundos</label>
        <input type="number" name="segundos" value="0">

        <label>Texto</label>
        <textarea name="texto"></textarea>

        <label>Responsável</label>
        <input type="text" name="responsavel">

        <label>Data</label>
        <input type="date" name="data">

        <input type="submit" value="Salvar">
    </form>
<a href="/list" class="botao-list">📋 Ver Lista</a>
</body>
</html>
